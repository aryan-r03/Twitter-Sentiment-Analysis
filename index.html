<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Sentiment Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .char-count {
            text-align: right;
            color: #666;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result.positive {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .result.negative {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .result h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .result.positive h3 {
            color: #28a745;
        }

        .result.negative h3 {
            color: #dc3545;
        }

        .scores {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .score-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .score-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 28px;
            font-weight: bold;
        }

        .score-value.positive {
            color: #28a745;
        }

        .score-value.negative {
            color: #dc3545;
        }

        .loading {
            text-align: center;
            color: #667eea;
            margin-top: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .info-box h4 {
            color: #1976d2;
            margin-bottom: 5px;
        }

        .info-box p {
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐦 Twitter Sentiment Analysis</h1>
            <p>AI-Powered Emotion Detection using Machine Learning</p>
            <div class="badge">Trained with Logistic Regression</div>
        </div>

        
</div>

        <div class="card">
            <h2>Enter Tweet</h2>
            <textarea 
                id="tweetInput" 
                placeholder="Type or paste a tweet here... (e.g., 'I love this amazing product!')"
                maxlength="280"
            ></textarea>
            <div class="char-count">
                <span id="charCount">0</span> / 280 characters
            </div>
            <button class="btn" id="analyzeBtn" onclick="analyzeSentiment()">
                Analyze Sentiment
            </button>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Analyzing sentiment...</p>
            </div>

            <div id="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        const tweetInput = document.getElementById('tweetInput');
        const charCount = document.getElementById('charCount');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const resultDiv = document.getElementById('result');

        tweetInput.addEventListener('input', function() {
            charCount.textContent = this.value.length;
        });

        async function analyzeSentiment() {
            const tweet = tweetInput.value.trim();

            if (!tweet) {
                alert('Please enter a tweet to analyze!');
                return;
            }

            analyzeBtn.disabled = true;
            loading.style.display = 'block';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ tweet: tweet })
                });

                const data = await response.json();

                if (data.success) {
                    displayResult(data.result);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error analyzing sentiment: ' + error.message);
            } finally {
                analyzeBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function displayResult(result) {
            const sentimentClass = result.sentiment.toLowerCase();

            resultDiv.innerHTML = `
                <h3>Sentiment: ${result.sentiment}</h3>
                <div class="scores">
                    <div class="score-item">
                        <div class="score-label">Confidence</div>
                        <div class="score-value">${result.confidence}%</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Positive Score</div>
                        <div class="score-value positive">${result.positive_score}%</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Negative Score</div>
                        <div class="score-value negative">${result.negative_score}%</div>
                    </div>
                </div>
            `;

            resultDiv.className = 'result ' + sentimentClass;
            resultDiv.style.display = 'block';
        }

        tweetInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.ctrlKey) {
                e.preventDefault();
                analyzeSentiment();
            }
        });
    </script>
</body>
</html>
